<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Video</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: transparent;
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        outline: none;
      }
    </style>
  </head>
  <body>
    <video controls playsinline></video>
    <script src="player.js"></script>
  </body>
</html>
